name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - if: runner.os == 'Windows'
        run: npx electron-builder --win nsis portable --x64 --publish never
      - if: runner.os == 'macOS'
        run: npx electron-builder --mac dmg --arm64 --x64 --publish never
        env: { CSC_IDENTITY_AUTO_DISCOVERY: false }
      - uses: actions/upload-artifact@v4
        with:
          name: capy-photo-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.dmg
      - name: 上傳到 Release
        shell: bash
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          VER=$(node -p "require('./package.json').version")
          gh release view "v$VER" >/dev/null 2>&1 || gh release create "v$VER" --title "Capy Photo V${VER%.0}" --notes "自動打包" || true
          gh release upload "v$VER" dist/*.exe dist/*.dmg --clobber 2>/dev/null || gh release upload "v$VER" $(ls dist/*.exe dist/*.dmg 2>/dev/null) --clobber
